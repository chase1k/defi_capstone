[profile.default]
auto_detect_solc = true
src = "src"
test = "test"
out = "out"
libs = ["lib"]
fs_permissions = [{ access = "read", path = "./builds" }]
evm_version = "cancun" # Works with solc 0.8.x, prevents prague issue

# Fuzz testing configuration
[fuzz]
runs = 10000
max_test_rejects = 65536
seed = "0x1234"
dictionary_weight = 40
include_storage = true
include_push_bytes = true

[profile.default.dependencies]
"@uniswap/v2-core" = { version = "0.5.16" }
"@uniswap/v2-periphery" = { version = "0.6.6" }
